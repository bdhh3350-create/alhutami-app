name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project Structure
        run: flutter create --org com.example . --platforms=android

      - name: Configure Firebase in Android Project
        run: |
          # نقل ملف إعدادات فايربيس
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi
          
          # إضافة Google Services Classpath في build.gradle الرئيسي
          sed -i 's/dependencies {/dependencies {\n        classpath "com.google.gms:google-services:4.4.1"/' android/build.gradle || true
          
          # تفعيل إضافة Google Services في build.gradle الخاص بالتطبيق
          echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle

      - name: Set Arabic App Name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="الحطامي للإلكترونيات"/g' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hutami-Electronics-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
