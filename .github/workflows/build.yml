name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project Structure
        run: flutter create --org com.example . --platforms=android

      - name: Configure Firebase in Android Project
        run: |
          # 1. نسخ ملف إعدادات فايربيس
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi

          # 2. إضافة إضافة Google Services في ملف settings.gradle بالنظام الحديث
          if [ -f "android/settings.gradle" ]; then
            sed -i '/id "dev.flutter.flutter-gradle-plugin"/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          elif [ -f "android/settings.gradle.kts" ]; then
            sed -i '/id("dev.flutter.flutter-gradle-plugin")/a \    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          fi

          # 3. تفعيل إضافة Google Services وضبط الـ SDK في ملف build.gradle
          if [ -f "android/app/build.gradle" ]; then
            sed -i '/id "dev.flutter.flutter-gradle-plugin"/a \    id "com.google.gms.google-services"' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          elif [ -f "android/app/build.gradle.kts" ]; then
            sed -i '/id("dev.flutter.flutter-gradle-plugin")/a \    id("com.google.gms.google-services")' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
          fi

      - name: Set Arabic App Name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="الحطامي للإلكترونيات"/g' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hutami-Electronics-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
