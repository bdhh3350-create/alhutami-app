name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project Structure
        run: flutter create --org com.example . --platforms=android

      - name: Ensure Permanent Keystore
        run: |
          mkdir -p ~/.android
          if [ -f "debug.keystore" ]; then
            echo "Using existing permanent keystore from repository."
            cp debug.keystore ~/.android/debug.keystore
          else
            echo "Generating permanent keystore for the first time..."
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore debug.keystore
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Save permanent signing keystore" || true
            git push origin main || true
          fi

      - name: Configure Firebase & Android Settings
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. نسخ ملف google-services.json
          if os.path.exists("google-services.json"):
              os.system("cp google-services.json android/app/")
              print("google-services.json copied.")

          # 2. إضافة Google Services في settings.gradle
          for settings_file in ["android/settings.gradle.kts", "android/settings.gradle"]:
              if os.path.exists(settings_file):
                  with open(settings_file, "r") as f:
                      content = f.read()
                  plugin_line = '    id("com.google.gms.google-services") version "4.4.2" apply false' if settings_file.endswith(".kts") else '    id "com.google.gms.google-services" version "4.4.2" apply false'
                  if "com.google.gms.google-services" not in content and "plugins {" in content:
                      content = content.replace("plugins {", f"plugins {{\n{plugin_line}")
                  with open(settings_file, "w") as f:
                      f.write(content)
                  print(f"Configured: {settings_file}")

          # 3. تفعيل الإضافة وضبط minSdk في app/build.gradle
          for app_gradle in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if os.path.exists(app_gradle):
                  with open(app_gradle, "r") as f:
                      content = f.read()
                  
                  app_plugin = '    id("com.google.gms.google-services")' if app_gradle.endswith(".kts") else '    id "com.google.gms.google-services"'
                  if "com.google.gms.google-services" not in content and "plugins {" in content:
                      content = content.replace("plugins {", f"plugins {{\n{app_plugin}")
                  
                  content = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', content)
                  content = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', content)
                  
                  with open(app_gradle, "w") as f:
                      f.write(content)
                  print(f"Configured: {app_gradle}")

          # 4. تعريب اسم التطبيق
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m_content = f.read()
              m_content = re.sub(r'android:label="[^"]*"', 'android:label="الحطامي للإلكترونيات"', m_content)
              with open(manifest_path, "w") as f:
                  f.write(m_content)
              print("App name set to Arabic.")
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hutami-Electronics-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
